services:
  - type: web
    name: resume-rag-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: qwen2.5:7b
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: OLLAMA_EMBEDDING_DIMENSIONS
        value: "768"
      - key: OLLAMA_NUM_CTX
        value: "8192"
      - key: FRONTEND_URL
        sync: false
